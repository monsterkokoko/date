<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a0b2e">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="У меня для тебя кое-что есть ♡">
  <title>♡</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="loading">
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="stage">
    <section class="card" id="card" aria-live="polite">
      <div class="card-shine" aria-hidden="true"></div>
      <div class="card-inner" id="cardInner"></div>
    </section>
  </main>

  <canvas id="fxTop" aria-hidden="true"></canvas>

  <button class="music-btn" id="musicBtn" type="button" aria-label="Музыка" hidden>
    <span class="eq"><i></i><i></i><i></i><i></i></span>
  </button>

  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor-ring"></div>
    <svg class="cursor-heart" viewBox="0 0 24 24"><path d="M12 21C11.3 20.4 2.5 14.8 2.5 8.6 2.5 5.4 4.8 3.2 7.6 3.2 9.6 3.2 11.2 4.4 12 6.3 12.8 4.4 14.4 3.2 16.4 3.2 19.2 3.2 21.5 5.4 21.5 8.6 21.5 14.8 12.7 20.4 12 21Z"/></svg>
  </div>
  <div class="finger" id="finger" aria-hidden="true"></div>
  <div class="replay-veil" id="replayVeil" hidden><span>вкладка свёрнута</span></div>

  <script src="/schema.js"></script>
  <script src="/app.js"></script>
</body>
</html>
